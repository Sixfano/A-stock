market:
  name: A-share
  timezone: Asia/Shanghai

screen:
  top_n:
    one_to_two: 10
    two_to_three: 8
    three_to_four: 5
    high_level: 5

# 2026-08-17 close review: keep the base weights unchanged. The additions below
# are process guardrails and shadow factors until enough out-of-sample data exists.
guardrails:
  decision_windows:
    formal_pool: "09:35"
    delayed_weak_to_strong_review: "10:00"
  weak_to_strong_soft_pool:
    auction_gap_pct: [0.0, 5.0]
    require_prior_distinctive: true
    require_sector_ladder: true
  scoring:
    separate_strength_and_tradability: true
    nonlinear_open_board_divergence: true
    dynamic_sentiment_multipliers: shadow
  evaluation:
    metrics: [precision, recall, false_negative_count, tradable_success_rate]
    minimum_trading_days_before_reweight: 5
    target_trading_days: 10
    minimum_candidates_before_reweight: 50
    target_candidates: 100

weights:
  one_to_two:
    limitup_quality: 0.20
    sector_strength: 0.20
    limitup_gene: 0.15
    turnover_quality: 0.15
    auction: 0.20
    sentiment: 0.10
  two_to_three:
    leader: 0.25
    sector_ladder: 0.15
    divergence_to_strength: 0.15
    auction: 0.20
    turnover: 0.10
    sentiment: 0.10
    risk: 0.05
  three_to_four:
    leader: 0.25
    market_height: 0.15
    sector_diffusion: 0.15
    turnover_structure: 0.15
    auction: 0.10
    sentiment: 0.10
    acceleration_risk: 0.10
  high_level:
    leader_identity: 0.25
    theme_core: 0.20
    market_height: 0.15
    sector_ladder: 0.10
    sentiment: 0.15
    auction: 0.10
    risk: 0.05
